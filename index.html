<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Prasad - UPI Test Payment</title>
    <!-- बिना किसी सर्ver के सुरक्षित QR जनरेट करने वाली भरोसेमंद लाइब्रेरी -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 40px; background-color: #f4f4f9; color: #333; }
        .container { background: white; padding: 25px; border-radius: 12px; display: inline-block; box-shadow: 0px 4px 15px rgba(0,0,0,0.1); width: 85%; max-width: 350px; }
        .qr-box { margin: 20px auto; display: flex; justify-content: center; }
        #canvas { width: 220px !important; height: 220px !important; border: 1px solid #ddd; padding: 5px; border-radius: 8px; background: white; }
        .btn { display: block; padding: 12px 20px; background-color: #0288d1; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 20px; font-size: 16px; }
        .date-box { background: #e1f5fe; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; color: #01579b; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Dr. Prasad - ऑटो डेबिट ट्रायल</h2>
    <p style="font-size: 14px; color: #666;">यह शून्य शुल्क (0% Fees) का एक टेस्ट पेज है।</p>
    
    <div class="date-box">
        🗓️ निर्धारित भुगतान तिथि: 05 नवंबर 2026
    </div>

    <!-- यहाँ बिना रुके 100% असली बारकोड दिखेगा -->
    <div class="qr-box">
        <canvas id="canvas"></canvas>
    </div>
    
    <p style="font-size: 13px;">मोबाइल से भुगतान करने के लिए नीचे क्लिक करें:</p>
    <a class="btn" href="upi://pay?pa=drprasad@okaxis&pn=Dr%20Prasad&tn=Trial%20Auto%20Debit&am=1.00&cu=INR">मोबाइल ऐप से पे करें</a>
</div>

<script>
    // सुरक्षित स्टेटिक NPCI UPI String
    var upiString = "upi://pay?pa=drprasad@okaxis&pn=Dr%20Prasad&tn=Trial%20Auto%20Debit&am=1.00&cu=INR";
    
    // कैनवास पर सुरक्षित बारकोड बनाना
    QRCode.toCanvas(document.getElementById('canvas'), upiString, { width: 220, margin: 1 }, function (error) {
        if (error) console.error(error);
    });
</script>

</body>
</html>
